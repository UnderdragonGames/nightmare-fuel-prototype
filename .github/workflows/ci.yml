name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deploy-build:
    name: Deploy path (bun frozen install + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Mirrors Railway exactly: a stale bun.lock fails here instead of in prod.
      - run: bun install --frozen-lockfile
      # tsc -b && vite build
      - run: bun run build

  tests:
    name: Unit tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run
